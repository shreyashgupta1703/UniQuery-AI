name: Deploy demo to GitHub Pages

# Builds the standalone, backend-free in-browser demo and publishes it to
# GitHub Pages. The demo runs the full retrieval pipeline client-side, so the
# published site needs no server. `demo.html` is the landing page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; skip queued runs in favor of the latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (static bundle incl. demo.html)
        run: npm run build

      - name: Make the in-browser demo the Pages landing page
        # The full app (index.html) needs a backend Pages can't provide, so the
        # published root serves the standalone, backend-free demo instead.
        run: cp dist/demo.html dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One-time setup: enable Pages at Settings → Pages → Source: "GitHub Actions".
    # Until then this step no-ops (continue-on-error) so the run stays green; the
    # built artifact is still produced by the `build` job above.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
