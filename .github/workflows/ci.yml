name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt python-multipart

      - name: Import check (FastAPI app must import with no optional deps)
        run: python -c "import app.main; print('app.main import OK')"

      - name: Compile all modules
        run: python -m compileall app eval scripts

      - name: Run tests with coverage (offline, no network)
        env:
          LOCALRAG_DISABLE_OLLAMA: "1"
        run: |
          coverage run -m pytest -q
          coverage report

      # A second pass with numpy installed exercises the vectorized search path
      # (the pure-Python fallback ran above) and enforces the coverage floor.
      - name: Run tests with numpy (vectorized path) + coverage gate
        if: matrix.python-version == '3.12'
        env:
          LOCALRAG_DISABLE_OLLAMA: "1"
        run: |
          pip install numpy
          coverage run -m pytest -q
          coverage report --fail-under=85

      - name: Retrieval eval report
        if: matrix.python-version == '3.12'
        env:
          LOCALRAG_DISABLE_OLLAMA: "1"
        run: python -m eval.harness

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
